sonar.projectKey=Alanjavier22_Tabula-Rasa
sonar.organization=alanjavier22
sonar.projectName=Tabula-Rasa
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=backend,frontend
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.py,frontend/tests/**/*.test.mjs

sonar.exclusions=backend/venv/**,frontend/node_modules/**,**/__pycache__/**,**/.pytest_cache/**,**/dist/**,**/build/**,backend/backups/**,backend/temp_uploads/**,**/*.db,**/*.sqlite,**/*.sqlite3,**/*.log,**/*.pem,**/*.key,**/*.crt,**/*.png
# El frontend tiene regresiones SSR, pero todavía no genera un reporte LCOV;
# mantener su fuente fuera de cobertura hasta instrumentarla, conservando el análisis estático.
sonar.coverage.exclusions=backend/main.py,backend/scripts/**,frontend/src/**,backend/tests/**,backend/alembic/**
sonar.python.coverage.reportPaths=backend/coverage.xml

# Hace que el workflow espere el resultado del Quality Gate de SonarCloud.
sonar.qualitygate.wait=true
