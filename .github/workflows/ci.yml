name: Validación continua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas y esquema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      AI_ENABLED: "false"
      JWT_SECRET: github-actions-ci-only-secret
      CONFIG_ENCRYPTION_KEY: github-actions-ci-only-key
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Aplicar migraciones en la base de CI
        run: python -m alembic upgrade head

      - name: Comprobar migraciones
        run: python -m alembic check

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint estricto
        run: npm run lint -- --max-warnings 0

      - name: Compilar frontend
        run: npm run build
